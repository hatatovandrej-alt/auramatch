services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: "http://localhost:5173,https://web.telegram.org"
      ENVIRONMENT: "development"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

